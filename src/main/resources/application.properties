# ==============================================================================
# DEFAULT APPLICATION CONFIGURATION (COMMON TO ALL ENVIRONMENTS)
# ==============================================================================

# Active profile: Defaults to 'local' for development
spring.profiles.active=local

# Application Name
spring.application.name=qunh-lan-makeup-be

# Default Server Port
server.port=8080

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Default fallback Datasource configuration using environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quynh_lan_makeup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.open-in-view=false
